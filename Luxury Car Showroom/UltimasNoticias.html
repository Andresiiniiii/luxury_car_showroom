<!DOCTYPE html>
<html lang="es"> 
    <head>
        <meta charset="UTF-8">
        <title>Luxury Cars</title>
        <style>
            body {
              margin: 0;
              min-height: 100%;
              background:url(./imagenes/fondo.jpg) fixed;
            }

            header {
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              z-index: 1;
              background-color: #333;
              color: #fff;
              padding: 10px;
              font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }

            .logo {
              display: flex;
              align-items: center;
              font-family: Magneto, Helvetica, sans-serif;
            }

            .logo img {
              margin-right: 10px;
              width: 70px;
            }

            h1.titulo {
              margin: 0;
              font-size: 40px;
              font-weight: bold;
              line-height: 40px;
            }

            header.cabecera nav {
              display: flex;
              align-items: center;
              justify-content: center;
            }

            header.cabecera nav ul {
              list-style: none;
              margin: 0;
              padding: 0;
            }

            header.cabecera nav li {
              display: inline-block;
              margin-left: 20px;
            }

            header.cabecera nav a {
              color: #fff;
              text-decoration: none;
              font-weight: bold;
              font-size: 20px;
              padding: 5px;
              border-radius: 5px;
              transition: background-color 0.5s;
            }
            

            header.cabecera nav a:hover {
              background-color: #a8a2a2;
            }

            /* Estilos para el seccion hero */
            .hero {
              background-image: url('./imagenes/MCLaren.png');
              background-size: cover;
              background-position: center;
              height: 400px;
              display: flex;
              align-items: center;
            }

            .hero-text {
              text-align: center;
              width: 100%;
              height: 0;
            }

            .hero-text h2 {
              color: #fff;
              font-size: 5em;
              margin: 0;
              font-weight: bold;
              text-shadow: 3px 7px 3px rgba(0,0,0,0.6);
              font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
              letter-spacing: 2px;
            }

            #noticias{
              text-align: center;
            }

            #noticias h1{
                font-family:Verdana, Geneva, Tahoma, sans-serif;
                color:midnightblue;
                margin: 50px;
            }
            #noticias a{
                text-decoration:underline ;
            }
        </style>
    </head>
    <body>
        <header class="cabecera">
            <div class="logo">
                <img src="./imagenes/FAVICON.png">
                <h1 class="titulo">Luxury Cars</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="Principal.html">Modelos</a></li>
                    <li><a href="">Últimas noticias</a></li>
                    <li><a href="SobreNosotros.html">Sobre nosotros</a></li>
                </ul>
            </nav>
        </header>
        <section class="hero">
            <div class="hero-text">
                <h2>Últimas noticias</h2>
            </div>
        </section>
        <section id="noticias">
          <div>
            <h1><a>18 de febrero:</a> LOS COCHES VOLADORES CADA VEZ MÁS CERCA!</h1>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/XuV_JRK9u2k?si=phFTvLRCFnGd7YO2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </section>
    </body>
</html>
